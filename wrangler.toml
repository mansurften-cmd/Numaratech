# Cloudflare Workers configuration for the NUMARATECH website.
#
# This is a Workers project with static assets (the build runs `wrangler deploy`,
# which is the Workers command — Pages would be `wrangler pages deploy`).
#
# The site is entirely static: there is no `main` entry point because there is no
# server-side code left. The contact form posts directly to Web3Forms from the
# browser, so no Worker, no Function and no server secret are involved.

# Must match the Worker Cloudflare builds and serves: "numaratech", at
# numaratech.mansurften.workers.dev (see the Workers Builds check on any commit).
# This said "numaratech-website", so a manual `npx wrangler deploy` would have
# created a second, separate Worker at numaratech-website.<subdomain> and left
# the real site unchanged.
name = "numaratech"
compatibility_date = "2026-07-30"

# Custom build, run by wrangler immediately before deploying — when wrangler
# is run by hand. Cloudflare's Workers Builds does NOT honour this block (see
# developers.cloudflare.com/workers/ci-cd/builds/configuration/); it runs the
# dashboard build command, `npm run build`. That script now runs the type
# check, the build, the security-header assertions and HTML validation, so a
# change that fails any of them fails the build and is never deployed.
#
# This makes `npx wrangler deploy` self-sufficient from a bare clone: it
# installs dependencies and builds the site itself, so the deploy works even
# when no build command is configured in the Cloudflare dashboard. Without it,
# a deploy-only pipeline fails with "Could not detect a directory containing
# static files" because ./dist was never produced.
#
# Setting the dashboard build command to `npm run build` as well is harmless —
# the second build is a no-op rebuild, not a conflict.
[build]
command = "npm install --no-audit --no-fund && npm run build"

[assets]
# Astro's static output (see astro.config.mjs → output: 'static').
# `wrangler deploy` fails with "Could not detect a directory containing static
# files" if this directory does not exist, so the build command must run before
# the deploy command. See the README.
directory = "./dist"

# Astro is configured with trailingSlash: 'always' and build.format: 'directory',
# so every route is a directory containing index.html.
html_handling = "auto-trailing-slash"

# Serve the built 404 page for unknown paths instead of a bare Workers error.
not_found_handling = "404-page"

# NOTE — this file is committed in plain text, so it must never hold a secret.
# The site currently needs none: the Web3Forms access key is a public,
# client-side key by design and lives in src/consts.ts.
